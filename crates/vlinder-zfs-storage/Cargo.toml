[package]
name = "vlinder-zfs-storage"
version = "0.1.0"
edition = "2021"
description = "HTTP-client WorkspaceStore impl that talks to vlinder-zfs-server (ADR 133)."

[dependencies]
vlinder-core = { path = "../vlinder-core" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
