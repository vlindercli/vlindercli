[package]
name = "vlinder-openai-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
vlinder-core = { path = "../vlinder-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.20.0", features = ["v4"] }
async-openai = { version = "0.32", default-features = false, features = ["chat-completion", "model-types", "embedding-types"] }
http = "1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.4", features = ["util"] }
hyper = "1"
chrono = { version = "0.4", features = ["serde"] }

[lints]
workspace = true