[package]
name = "vlinder-ollama"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["routing", "worker"]
routing = []
worker = []

[dependencies]
vlinder-core = { path = "../vlinder-core" }
async-openai = { version = "0.32", default-features = false, features = ["chat-completion-types"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

[lints]
workspace = true
