[package]
name = "vlinder-harness"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["client", "server"]
client = []
server = ["tonic/server", "tonic/router"]

[dependencies]
vlinder-core = { path = "../vlinder-core" }
async-trait = "0.1"
tonic = { version = "0.12", default-features = false, features = ["channel", "codegen", "prost", "transport", "tls", "tls-roots"] }
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.12"

[lints]
workspace = true
