[package]
name = "vlinder-podman-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
vlinder-core = { path = "../vlinder-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
semver = "1"
dirs = "6"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
