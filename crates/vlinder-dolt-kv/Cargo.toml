[package]
name = "vlinder-dolt-kv"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["routing", "worker"]
routing = []
worker = ["dep:tokio", "dep:tokio-postgres"]

[dependencies]
vlinder-core = { path = "../vlinder-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", optional = true, features = ["rt", "time", "net", "io-util", "sync"] }
tokio-postgres = { version = "0.7", optional = true }


[dev-dependencies]
tempfile = "3"
