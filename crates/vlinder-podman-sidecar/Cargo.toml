[package]
name = "vlinder-podman-sidecar"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "vlinder-podman-sidecar"
path = "src/main.rs"

[dependencies]
vlinder-core = { path = "../vlinder-core" }
vlinder-provider-server = { path = "../vlinder-provider-server", features = ["amqp"] }
vlinder-amqp = { path = "../vlinder-amqp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
semver = "1"
ureq = "2"

[lints]
workspace = true
