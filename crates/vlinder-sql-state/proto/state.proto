syntax = "proto3";

package vlinder.state;

// =============================================================================
// State Service — gRPC interface to the DagStore trait (ADR 079)
// =============================================================================

service StateService {
  // Health check — returns server's protocol version
  rpc Ping(PingRequest) returns (SemVer);

  // DagStore trait methods
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc GetSessionNodes(GetSessionNodesRequest) returns (GetSessionNodesResponse);
  rpc GetChildren(GetChildrenRequest) returns (GetChildrenResponse);

  // Branch methods
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  rpc GetBranchByName(GetBranchByNameRequest) returns (GetBranchResponse);
  rpc GetBranch(GetBranchByIdRequest) returns (GetBranchResponse);

  // Session CRUD
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc GetSessionByName(GetSessionByNameRequest) returns (GetSessionResponse);

  // Session queries
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetNodesBySubmission(GetNodesBySubmissionRequest) returns (GetNodesBySubmissionResponse);
  rpc GetNodeByPrefix(GetNodeByPrefixRequest) returns (GetNodeResponse);
  rpc GetBranchesForSession(GetBranchesForSessionRequest) returns (GetBranchesForSessionResponse);

  // Typed node operations (ADR 122)
  rpc InsertInvokeNode(InsertInvokeNodeRequest) returns (InsertInvokeNodeResponse);
  rpc InsertCompleteNode(InsertCompleteNodeRequest) returns (InsertCompleteNodeResponse);
  rpc GetInvokeNode(GetInvokeNodeRequest) returns (GetInvokeNodeResponse);
  rpc GetCompleteNode(GetCompleteNodeRequest) returns (GetCompleteNodeResponse);
  rpc GetRequestNode(GetRequestNodeRequest) returns (GetRequestNodeResponse);
  rpc GetResponseNode(GetResponseNodeRequest) returns (GetResponseNodeResponse);
  rpc InsertRequestNode(InsertRequestNodeRequest) returns (InsertRequestNodeResponse);
  rpc InsertResponseNode(InsertResponseNodeRequest) returns (InsertResponseNodeResponse);
  rpc InsertForkNode(InsertForkNodeRequest) returns (InsertForkNodeResponse);
  rpc InsertPromoteNode(InsertPromoteNodeRequest) returns (InsertPromoteNodeResponse);
  rpc InsertDeployAgentNode(InsertDeployAgentNodeRequest) returns (InsertDeployAgentNodeResponse);
  rpc InsertDeleteAgentNode(InsertDeleteAgentNodeRequest) returns (InsertDeleteAgentNodeResponse);

  // V2 service nodes (MCP)
  rpc InsertSvcRequestNode(InsertSvcRequestNodeRequest) returns (InsertSvcRequestNodeResponse);
  rpc InsertSvcResponseNode(InsertSvcResponseNodeRequest) returns (InsertSvcResponseNodeResponse);
  rpc GetSvcRequestNode(GetSvcRequestNodeRequest) returns (GetSvcRequestNodeResponse);
  rpc GetSvcResponseNode(GetSvcResponseNodeRequest) returns (GetSvcResponseNodeResponse);

  // Typed message accessors (projection from envelope, no routing key)
  rpc GetInvokeMessage(GetInvokeMessageRequest) returns (GetInvokeMessageResponse);
  rpc GetCompleteMessage(GetCompleteMessageRequest) returns (GetCompleteMessageResponse);
  rpc GetRequestV2(GetRequestV2Request) returns (GetRequestV2Response);
  rpc GetResponseV2(GetResponseV2Request) returns (GetResponseV2Response);

  // Branch head query
  rpc LatestNodeOnBranch(LatestNodeOnBranchRequest) returns (LatestNodeOnBranchResponse);
  rpc LatestNodesOnBranch(LatestNodesOnBranchRequest) returns (LatestNodesOnBranchResponse);

  // Branch mutation
  rpc RenameBranch(RenameBranchRequest) returns (RenameBranchResponse);
  rpc SealBranch(SealBranchRequest) returns (SealBranchResponse);

  // Session mutation
  rpc UpdateSessionDefaultBranch(UpdateSessionDefaultBranchRequest) returns (UpdateSessionDefaultBranchResponse);
}

// =============================================================================
// Health Check
// =============================================================================

message PingRequest {}

message SemVer {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

// =============================================================================
// DagNode
// =============================================================================

message DagNode {
  string hash = 1;
  string parent_hash = 2;
  string message_type = 3;         // "invoke", "request", "response", "complete", "delegate"
  string sender = 4;               // "from" in domain (reserved word in proto)
  string receiver = 5;             // "to" in domain
  string session_id = 6;
  string submission_id = 7;
  bytes payload = 8;
  bytes diagnostics = 9;
  bytes stderr = 10;
  string created_at = 11;          // ISO-8601
  optional string state = 12;
  string protocol_version = 13;
  optional string checkpoint = 14;
  optional string operation = 15;
  optional string message_blob = 16;  // JSON-serialized ObservableMessage (source of truth)
  int64 branch_id = 17;             // branch ID
}

// =============================================================================
// RPC Messages
// =============================================================================

message GetNodeRequest { string hash = 1; }
message GetNodeResponse { optional DagNode node = 1; }

message GetSessionNodesRequest { string session_id = 1; }
message GetSessionNodesResponse { repeated DagNode nodes = 1; }

message GetChildrenRequest { string parent_hash = 1; }
message GetChildrenResponse { repeated DagNode nodes = 1; }

// =============================================================================
// Branch
// =============================================================================

message Branch {
  int64 id = 1;
  string name = 2;
  string session_id = 3;
  optional string fork_point = 4;
  optional string head = 5;
  string created_at = 6;                 // ISO-8601
  optional string broken_at = 7;         // ISO-8601, None = still active
}

message CreateBranchRequest {
  string name = 1;
  string session_id = 2;
  optional string fork_point = 3;
}
message CreateBranchResponse { int64 id = 1; }

message GetBranchByNameRequest { string name = 1; }
message GetBranchByIdRequest { int64 id = 1; }
message GetBranchResponse { optional Branch branch = 1; }

// =============================================================================
// Session CRUD
// =============================================================================

message SessionProto {
  string id = 1;
  string external_id = 6;
  string name = 2;
  string agent_name = 3;
  int64 default_branch = 4;
  string created_at = 5;  // ISO-8601
}

message CreateSessionRequest { SessionProto session = 1; }
message CreateSessionResponse { bool success = 1; optional string error = 2; }

message GetSessionRequest { string session_id = 1; }
message GetSessionByNameRequest { string name = 1; }
message GetSessionResponse { optional SessionProto session = 1; }

// =============================================================================
// Session Queries
// =============================================================================

message SessionSummary {
  string session_id = 1;
  string agent_name = 2;
  string started_at = 3;
  uint64 message_count = 4;
  bool is_open = 5;
}

message ListSessionsRequest {}
message ListSessionsResponse { repeated SessionSummary sessions = 1; }

message GetNodesBySubmissionRequest { string submission_id = 1; }
message GetNodesBySubmissionResponse { repeated DagNode nodes = 1; }

message GetNodeByPrefixRequest { string prefix = 1; }

message GetBranchesForSessionRequest { string session_id = 1; }
message GetBranchesForSessionResponse { repeated Branch branches = 1; }

// =============================================================================
// Branch Head Query
// =============================================================================

message LatestNodeOnBranchRequest {
  int64 branch_id = 1;
  optional string message_type = 2;  // e.g. "invoke", "complete"; omit for any type
}
message LatestNodeOnBranchResponse { optional DagNode node = 1; }

message LatestNodesOnBranchRequest {
  int64 branch_id = 1;
  uint32 n = 2;
}
message LatestNodesOnBranchResponse { repeated DagNode nodes = 1; }

// =============================================================================
// Branch Mutation
// =============================================================================

message RenameBranchRequest {
  int64 id = 1;
  string new_name = 2;
}
message RenameBranchResponse { bool success = 1; optional string error = 2; }

message SealBranchRequest {
  int64 id = 1;
  string broken_at = 2;  // ISO-8601
}
message SealBranchResponse { bool success = 1; optional string error = 2; }

// =============================================================================
// Session Mutation
// =============================================================================

message UpdateSessionDefaultBranchRequest {
  string session_id = 1;
  int64 branch_id = 2;
}
message UpdateSessionDefaultBranchResponse { bool success = 1; optional string error = 2; }

// =============================================================================
// Typed Node Operations (ADR 122)
// =============================================================================

message InsertInvokeNodeRequest {
  InvokeNodeProto node = 1;
  string parent_hash = 2;
  string created_at = 3;
  string snapshot = 4;
}
message InsertInvokeNodeResponse {
  bool success = 1;
  optional string error = 2;
}

message GetInvokeNodeRequest { string dag_hash = 1; }
message GetInvokeNodeResponse {
  optional InvokeNodeProto node = 1;
}

message InvokeNodeProto {
  // Routing
  string session_id = 1;
  int64 branch = 2;
  string submission_id = 3;
  string harness = 4;
  string runtime = 5;
  string agent = 6;
  // Payload
  string message_id = 7;
  optional string state = 8;
  bytes diagnostics = 9;
  bytes payload = 10;
  string dag_parent = 11;
  string dag_hash = 12;
}

message InsertCompleteNodeRequest {
  string dag_hash = 1;
  string parent_hash = 2;
  string created_at = 3;
  string snapshot = 4;
  string session_id = 5;
  string submission_id = 6;
  int64 branch_id = 7;
  string agent = 8;
  string harness = 9;
  string message_id = 10;
  optional string state = 11;
  bytes diagnostics = 12;
  bytes payload = 13;
}
message InsertCompleteNodeResponse {
  bool success = 1;
  optional string error = 2;
}

message GetCompleteNodeRequest { string dag_hash = 1; }
message GetCompleteNodeResponse {
  optional CompleteNodeProto node = 1;
}

message CompleteNodeProto {
  // Routing
  string session_id = 1;
  int64 branch = 2;
  string submission_id = 3;
  string agent = 4;
  string harness = 5;
  // Payload
  string message_id = 6;
  optional string state = 7;
  bytes diagnostics = 8;
  bytes payload = 9;
  string dag_hash = 10;
}

message GetRequestNodeRequest { string dag_hash = 1; }
message GetRequestNodeResponse {
  optional RequestNodeProto node = 1;
}

message RequestNodeProto {
  // Routing
  string session_id = 1;
  int64 branch = 2;
  string submission_id = 3;
  string agent = 4;
  string service = 5;
  string operation = 6;
  uint32 sequence = 7;
  // Payload
  string message_id = 8;
  optional string state = 9;
  bytes diagnostics = 10;
  bytes payload = 11;
  string dag_hash = 12;
  optional string checkpoint = 13;
}

message InsertRequestNodeRequest {
  string dag_hash = 1;
  string parent_hash = 2;
  string created_at = 3;
  string snapshot = 4;
  string session_id = 5;
  string submission_id = 6;
  int64 branch_id = 7;
  string agent = 8;
  string service = 9;
  string operation = 10;
  uint32 sequence = 11;
  string message_id = 12;
  optional string state = 13;
  bytes diagnostics = 14;
  bytes payload = 15;
  optional string checkpoint = 16;
}
message InsertRequestNodeResponse {
  bool success = 1;
  optional string error = 2;
}

message GetResponseNodeRequest { string dag_hash = 1; }
message GetResponseNodeResponse {
  optional ResponseNodeProto node = 1;
}

message ResponseNodeProto {
  // Routing
  string session_id = 1;
  int64 branch = 2;
  string submission_id = 3;
  string agent = 4;
  string service = 5;
  string operation = 6;
  uint32 sequence = 7;
  // Payload
  string message_id = 8;
  string correlation_id = 9;
  optional string state = 10;
  bytes diagnostics = 11;
  bytes payload = 12;
  uint32 status_code = 13;
  string dag_hash = 14;
  optional string checkpoint = 15;
}

message InsertResponseNodeRequest {
  string dag_hash = 1;
  string parent_hash = 2;
  string created_at = 3;
  string snapshot = 4;
  string session_id = 5;
  string submission_id = 6;
  int64 branch_id = 7;
  string agent = 8;
  string service = 9;
  string operation = 10;
  uint32 sequence = 11;
  string message_id = 12;
  string correlation_id = 13;
  optional string state = 14;
  bytes diagnostics = 15;
  bytes payload = 16;
  uint32 status_code = 17;
  optional string checkpoint = 18;
}
message InsertResponseNodeResponse {
  bool success = 1;
  optional string error = 2;
}

message InsertForkNodeRequest {
  string dag_hash = 1;
  string parent_hash = 2;
  string created_at = 3;
  string snapshot = 4;
  string session_id = 5;
  string submission_id = 6;
  string agent_name = 7;
  string message_id = 8;
  string branch_name = 9;
  string fork_point = 10;
}
message InsertForkNodeResponse {
  bool success = 1;
  optional string error = 2;
}

message InsertPromoteNodeRequest {
  string dag_hash = 1;
  string parent_hash = 2;
  string created_at = 3;
  string snapshot = 4;
  string session_id = 5;
  string submission_id = 6;
  string agent_name = 7;
  string message_id = 8;
  int64 branch_id = 9;
}
message InsertPromoteNodeResponse {
  bool success = 1;
  optional string error = 2;
}

message InsertDeployAgentNodeRequest {
  string dag_hash = 1;
  string parent_hash = 2;
  string created_at = 3;
  string snapshot = 4;
  string submission_id = 5;
  string agent_name = 6;
  string manifest_json = 7;
  string message_id = 8;
}
message InsertDeployAgentNodeResponse {
  bool success = 1;
  optional string error = 2;
}

message InsertDeleteAgentNodeRequest {
  string dag_hash = 1;
  string parent_hash = 2;
  string created_at = 3;
  string snapshot = 4;
  string submission_id = 5;
  string agent_name = 6;
  string message_id = 7;
}
message InsertDeleteAgentNodeResponse {
  bool success = 1;
  optional string error = 2;
}

// =============================================================================
// V2 Service Nodes (MCP)
// =============================================================================

message InsertSvcRequestNodeRequest {
  string dag_hash = 1;
  string parent_hash = 2;
  string created_at = 3;
  string snapshot = 4;
  string session_id = 5;
  string submission_id = 6;
  int64 branch_id = 7;
  string agent = 8;
  string service_type = 9;
  string service_backend = 10;
  string operation = 11;
  uint32 sequence = 12;
  string message_id = 13;
  string tool_call_id = 14;
  bytes arguments = 15;
  optional string state = 16;
  optional string diagnostics = 17;
}
message InsertSvcRequestNodeResponse {
  bool success = 1;
  optional string error = 2;
}

message InsertSvcResponseNodeRequest {
  string dag_hash = 1;
  string parent_hash = 2;
  string created_at = 3;
  string snapshot = 4;
  string session_id = 5;
  string submission_id = 6;
  int64 branch_id = 7;
  string agent = 8;
  string service_type = 9;
  string service_backend = 10;
  string operation = 11;
  uint32 sequence = 12;
  string message_id = 13;
  string correlation_id = 14;
  bytes payload = 15;
  optional string state = 16;
  optional string diagnostics = 17;
}
message InsertSvcResponseNodeResponse {
  bool success = 1;
  optional string error = 2;
}

message GetSvcRequestNodeRequest { string dag_hash = 1; }
message GetSvcRequestNodeResponse {
  optional SvcRequestNodeProto node = 1;
}

message SvcRequestNodeProto {
  // Routing
  string session_id = 1;
  int64 branch = 2;
  string submission_id = 3;
  string agent = 4;
  string service_type = 5;
  string service_backend = 6;
  string operation = 7;
  uint32 sequence = 8;
  // Payload
  string message_id = 9;
  string tool_call_id = 10;
  optional string state = 11;
  bytes arguments = 12;
  optional string diagnostics = 13;
}

message GetSvcResponseNodeRequest { string dag_hash = 1; }
message GetSvcResponseNodeResponse {
  optional SvcResponseNodeProto node = 1;
}

message SvcResponseNodeProto {
  // Routing
  string session_id = 1;
  int64 branch = 2;
  string submission_id = 3;
  string agent = 4;
  string service_type = 5;
  string service_backend = 6;
  string operation = 7;
  uint32 sequence = 8;
  // Payload
  string message_id = 9;
  string correlation_id = 10;
  optional string state = 11;
  bytes payload = 12;
  optional string diagnostics = 13;
}

// =============================================================================
// Typed Message Accessors (projection, no routing key)
// =============================================================================

message GetInvokeMessageRequest { string dag_node_id = 1; }
message GetInvokeMessageResponse { optional InvokeMessageProto message = 1; }

message InvokeMessageProto {
  string id = 1;
  string dag_id = 2;
  optional string state = 3;
  bytes diagnostics = 4;
  string dag_parent = 5;
  bytes payload = 6;  // JSON-serialized full InvokeMessage (history, current_input, all fields)
}

message GetCompleteMessageRequest { string dag_node_id = 1; }
message GetCompleteMessageResponse { optional CompleteMessageProto message = 1; }

message CompleteMessageProto {
  string id = 1;
  string dag_id = 2;
  string dag_parent = 3;
  optional string state = 4;
  bytes diagnostics = 5;
  bytes payload = 6;  // JSON-serialized full CompleteMessage (content, tool_calls, all fields)
}

message GetRequestV2Request { string dag_node_id = 1; }
message GetRequestV2Response { optional RequestV2Proto message = 1; }

message RequestV2Proto {
  string id = 1;
  string dag_id = 2;
  string dag_parent = 3;
  string tool_call_id = 4;
  optional string state = 5;
  bytes diagnostics = 6;
  bytes payload = 7;  // JSON-serialized full RequestV2
}

message GetResponseV2Request { string dag_node_id = 1; }
message GetResponseV2Response { optional ResponseV2Proto message = 1; }

message ResponseV2Proto {
  string id = 1;
  string dag_id = 2;
  string dag_parent = 3;
  string correlation_id = 4;
  optional string state = 5;
  bytes diagnostics = 6;
  bytes payload = 7;  // JSON-serialized full ResponseV2
}
