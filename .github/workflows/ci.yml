name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Repo-local .cargo/config.toml sets rustc-wrapper = "sccache" for dev
  # ergonomics. Override to empty in CI — sccache on ubuntu-latest either
  # isn't installed or hits the retired GHAC v1 cache endpoint. This env
  # var takes precedence over the config file.
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run tests
        run: cargo test --workspace

  licenses:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check licenses
        run: cargo deny check licenses

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies for known vulnerabilities
        # RUSTSEC-2026-0049: rustls-webpki 0.101 CRL validation bug.
        # Transitive dep from AWS SDK's rustls 0.21 (aws-smithy-http-client).
        # Blocked until AWS updates: github.com/awslabs/aws-sdk-rust/discussions/1257
        #
        # RUSTSEC-2026-0097: rand 0.10.0 unsound with custom logger using rand::rng().
        # Transitive dep via lapin → amq-protocol → tcp-stream → p12-keystore.
        # Flagged 2026-04-09; waiting on lapin to bump amq-protocol.
        #
        # RUSTSEC-2026-0098 / RUSTSEC-2026-0099: rustls-webpki name-constraint
        # bypasses (URI + wildcard). Affect 0.101.7, 0.102.8, 0.103.10; pulled
        # in via multiple rustls versions from AWS SDK and other TLS stacks.
        # Patched versions exist upstream but we can't upgrade cleanly until
        # all transitive consumers bump.
        #
        # RUSTSEC-2025-0119: number_prefix unmaintained. Transitive via indicatif.
        # RUSTSEC-2025-0134: rustls-pemfile unmaintained (migration to rustls-pki-types).
        # Both are warnings, not vulnerabilities; ignore until upstream migrates.
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2025-0134
      - name: Check advisories via cargo-deny
        run: cargo install cargo-deny --locked && cargo deny check advisories

  build-arm:
    name: Build ARM Linux (AL2023)
    needs: [lint, test]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build in AL2023 container
        run: |
          docker run --rm \
            -e CARGO_BUILD_RUSTC_WRAPPER="" \
            -v "${{ github.workspace }}:/src" \
            -v cargo-registry:/root/.cargo/registry \
            -v cargo-git:/root/.cargo/git \
            -w /src \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            bash -c '
              dnf install -y gcc gcc-c++ make perl-core openssl-devel unzip &&
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
              source "$HOME/.cargo/env" &&
              curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-aarch_64.zip &&
              unzip protoc-28.3-linux-aarch_64.zip -d /usr/local &&
              cargo build --release -p vlinder -p vlinderd --features vlinderd/vendored-openssl -p vlinder-lambda-adapter
            '
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm-binaries
          path: |
            target/release/vlinder
            target/release/vlinderd
            target/release/vlinder-lambda-adapter

  upload-s3:
    name: Upload to S3
    needs: [build-arm]
    if: vars.UPLOAD_S3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: arm-binaries
          path: binaries
      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-1
        run: |
          aws s3 cp binaries/vlinder "s3://${{ secrets.ARTIFACTS_BUCKET }}/${{ github.sha }}/vlinder"
          aws s3 cp binaries/vlinder "s3://${{ secrets.ARTIFACTS_BUCKET }}/latest/vlinder"
          aws s3 cp binaries/vlinderd "s3://${{ secrets.ARTIFACTS_BUCKET }}/${{ github.sha }}/vlinderd"
          aws s3 cp binaries/vlinderd "s3://${{ secrets.ARTIFACTS_BUCKET }}/latest/vlinderd"
          aws s3 cp binaries/vlinder-lambda-adapter "s3://${{ secrets.ARTIFACTS_BUCKET }}/${{ github.sha }}/vlinder-lambda-adapter"
          aws s3 cp binaries/vlinder-lambda-adapter "s3://${{ secrets.ARTIFACTS_BUCKET }}/latest/vlinder-lambda-adapter"
