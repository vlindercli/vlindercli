# cargo-deny configuration
# Run: cargo deny check licenses
# Run: cargo deny check advisories
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
unmaintained = "workspace"

# rustls-webpki 0.101 CRL validation advisory.
# Transitive dep from AWS SDK's rustls 0.21 (aws-smithy-http-client).
# Blocked until AWS updates their HTTP client stack.
# Tracking: github.com/awslabs/aws-sdk-rust/discussions/1257
[[advisories.ignore]]
id = "RUSTSEC-2026-0049"
reason = "Transitive dep from AWS SDK's rustls 0.21 — can't upgrade until aws-smithy-http-client drops rustls 0.21"

# rand 0.10.0 unsound with custom logger using rand::rng().
# Flagged 2026-04-09. Transitive dep via lapin → amq-protocol → tcp-stream → p12-keystore.
# Blocked until lapin publishes a release with an updated amq-protocol.
[[advisories.ignore]]
id = "RUSTSEC-2026-0097"
reason = "Transitive dep via lapin; waiting on lapin to bump amq-protocol's rand dependency"

# rustls-webpki name-constraint bypass (URI names).
# Affects 0.101.7, 0.102.8, 0.103.10 across multiple transitive paths.
[[advisories.ignore]]
id = "RUSTSEC-2026-0098"
reason = "rustls-webpki URI name-constraint bypass; pulled in via multiple rustls versions we don't directly control"

# rustls-webpki name-constraint bypass (wildcard certs).
# Same crate as -0098, different advisory.
[[advisories.ignore]]
id = "RUSTSEC-2026-0099"
reason = "rustls-webpki wildcard name-constraint bypass; pulled in via multiple rustls versions we don't directly control"

# number_prefix unmaintained. Transitive via indicatif. Warning, not a vulnerability.
[[advisories.ignore]]
id = "RUSTSEC-2025-0119"
reason = "number_prefix crate unmaintained; transitive via indicatif, waiting on indicatif to drop it"

# rustls-pemfile unmaintained (superseded by rustls-pki-types). Warning.
[[advisories.ignore]]
id = "RUSTSEC-2025-0134"
reason = "rustls-pemfile unmaintained; transitive via tonic/async-nats, waiting on those crates to migrate"

[licenses]
# Allow only permissive licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

confidence-threshold = 0.8

# Ignore our own unpublished crate
[licenses.private]
ignore = true

# Clarify ring's license (commonly needed)
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
