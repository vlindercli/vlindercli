services:
  vlinderd:
    build: .
    depends_on:
      - nats
      - ollama
      - data-loader
    ports:
      - "8080:8080"
    environment:
      - VLINDER_DIR=/config
      - RUST_BACKTRACE=1
    volumes:
      - vlinder_data:/config
  nats:
    image: nats:latest
    container_name: nats-server
    ports:
      - "4222:4222"
    command: ["-js"]
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
  data-loader:
    image: alpine
    container_name: minimal-config-data-loader
    volumes:
      - vlinder_data:/config        # Mount the named volume
      - ./:/source:ro     # Mount your local folder (Read-Only)
    command: sh -c "cp -rp /source/minimal_config.toml /config/config.toml"
volumes:
  vlinder_data:
  ollama_storage: